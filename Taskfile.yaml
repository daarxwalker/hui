version: "3"

vars:
    PACKAGE: "@daar/hui-alpine"
    NOTES: |-
        awk '/^## /{ if (found) exit; found = $0 == "## [Unreleased]"; next } found'

tasks:
    generate:
        desc: Regenerate the templ files and the Alpine dist
        cmds:
            - templ generate
            - npm --prefix alpine run build

    check:
        desc: Run gofmt, go vet and the tests
        cmds:
            - cmd: |
                  unformatted="$(gofmt -l .)"
                  [ -z "$unformatted" ] || { echo "gofmt: $unformatted" >&2; exit 1; }
            - go vet ./...
            - go test -count=1 ./...

    release:
        desc: Check, tag and push VERSION, create the GitHub release from CHANGELOG.md, then publish the same version to npm (task release VERSION=v0.2.0)
        requires:
            vars: [VERSION]
        cmds:
            - task: release:check
            - task: release:git
            - task: release:github
            - task: release:npm

    release:check:
        desc: Run every release check for VERSION without tagging or publishing anything
        requires:
            vars: [VERSION]
        vars:
            NPM_VERSION: '{{trimPrefix "v" .VERSION}}'
        cmds:
            - cmd: |
                  set -e
                  fail() { echo "release: $*" >&2; exit 1; }
                  newer() {
                      [ -z "$2" ] && return 0
                      [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)" = "$1" ]
                  }
                  version="{{.NPM_VERSION}}"
                  echo "{{.VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || fail "VERSION must look like v1.2.3, got '{{.VERSION}}'"
                  [ "$(git rev-parse --abbrev-ref HEAD)" = main ] || fail "release from the main branch"
                  [ -z "$(git status --porcelain)" ] || fail "the working tree is not clean, commit or stash your changes first"
                  git fetch --quiet --tags origin
                  [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || fail "main is not in sync with origin/main, push or pull first"
                  if git rev-parse -q --verify "refs/tags/{{.VERSION}}" >/dev/null; then
                      fail "tag {{.VERSION}} already exists; to finish its release run: task release:github VERSION={{.VERSION}} or task release:npm VERSION={{.VERSION}}"
                  fi
                  tag="$(git tag -l --sort=-v:refname 'v[0-9]*' | head -n1)"
                  newer "$version" "${tag#v}" || fail "VERSION {{.VERSION}} must be higher than the last tag $tag"
                  published="$(npm view "{{.PACKAGE}}" version 2>/dev/null || true)"
                  newer "$version" "$published" || fail "VERSION {{.VERSION}} must be higher than $published on npm"
                  [ -n "$({{.NOTES}} < CHANGELOG.md | tr -d '[:space:]')" ] || fail "CHANGELOG.md has nothing under '## [Unreleased]'"
                  gh auth status >/dev/null 2>&1 || fail "gh is not installed or not logged in, run: gh auth login"
                  npm whoami >/dev/null 2>&1 || fail "not logged in to npm, run: npm login"
                  echo "release: {{.VERSION}} follows ${tag:-no tag} on git and ${published:-nothing} on npm"
            - npm --prefix alpine ci
            - task: generate
            - cmd: |
                  [ -z "$(git status --porcelain)" ] || {
                      git status --short >&2
                      echo "release: the committed *_templ.go or alpine/dist are out of date, commit the regenerated files first" >&2
                      exit 1
                  }
            - task: check

    release:git:
        internal: true
        requires:
            vars: [VERSION]
        cmds:
            - cmd: |
                  { echo "{{.VERSION}}"; echo; {{.NOTES}} < CHANGELOG.md; } | git tag -a "{{.VERSION}}" --cleanup=whitespace -F -
            - git push origin "{{.VERSION}}"
            - cmd: |
                  set -e
                  awk '{ print } $0 == "## [Unreleased]" { exit }' CHANGELOG.md > CHANGELOG.md.tmp
                  mv CHANGELOG.md.tmp CHANGELOG.md
                  echo "release: CHANGELOG.md is empty again under '## [Unreleased]', commit it"

    release:github:
        desc: Create the GitHub release of tag VERSION with the CHANGELOG.md notes it was tagged with, also to finish a release whose GitHub step failed
        requires:
            vars: [VERSION]
        preconditions:
            - sh: git rev-parse -q --verify "refs/tags/{{.VERSION}}" >/dev/null
              msg: "tag {{.VERSION}} does not exist, run: task release VERSION={{.VERSION}}"
            - sh: gh auth status >/dev/null 2>&1
              msg: "gh is not installed or not logged in, run: gh auth login"
            - sh: '[ -z "$(gh release view "{{.VERSION}}" --json tagName 2>/dev/null)" ]'
              msg: "the GitHub release {{.VERSION}} already exists"
        cmds:
            - cmd: |
                  git show "{{.VERSION}}:CHANGELOG.md" | {{.NOTES}} | gh release create "{{.VERSION}}" --verify-tag --title "{{.VERSION}}" --notes-file -

    release:npm:
        desc: Publish the Alpine package of tag VERSION to npm, also to finish a release whose npm step failed
        requires:
            vars: [VERSION]
        vars:
            NPM_VERSION: '{{trimPrefix "v" .VERSION}}'
        preconditions:
            - sh: git rev-parse -q --verify "refs/tags/{{.VERSION}}" >/dev/null
              msg: "tag {{.VERSION}} does not exist, run: task release VERSION={{.VERSION}}"
            - sh: '[ -z "$(npm view "{{.PACKAGE}}@{{.NPM_VERSION}}" version 2>/dev/null)" ]'
              msg: "{{.PACKAGE}}@{{.NPM_VERSION}} is already on npm"
            - sh: npm whoami >/dev/null 2>&1
              msg: "not logged in to npm, run: npm login"
        cmds:
            - cmd: |
                  set -e
                  stage="$(mktemp -d)"
                  git archive "{{.VERSION}}" alpine | tar -x -C "$stage"
                  cd "$stage/alpine"
                  npm pkg set version="{{.NPM_VERSION}}"
                  npm publish --access public
                  cd /
                  rm -rf "$stage"
              interactive: true
